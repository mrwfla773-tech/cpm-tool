<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0d0d1a" />
<title>安全访问验证</title>
<style>
  :root{
    --bg-main:#0d0d1a;
    --bg-panel:#16162b;
    --bg-dark:#0a0a14;
    --text-main:#e8e8ff;
    --text-gray:#999ab8;
    --accent-blue:#3b88ff;
    --accent-purple:#9d5cff;
    --accent-red:#ff4757;
    --accent-green:#2ed573;
    --accent-yellow:#ffd32a;
    --border:#2a2a4a;
    --input-bg:#1f1f3a;
  }
  *{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft Yahei",system-ui,-apple-system,sans-serif;}
  html,body{min-height:100%;}
  body{
    background:
      radial-gradient(900px 480px at 8% -12%, rgba(59,136,255,.18), transparent 62%),
      radial-gradient(760px 420px at 96% 4%, rgba(157,92,255,.16), transparent 60%),
      var(--bg-main);
    color:var(--text-main);
    line-height:1.6;
    padding:18px 14px calc(26px + env(safe-area-inset-bottom));
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .wrap{width:100%;max-width:420px;}
  header{text-align:center;margin-bottom:18px;}
  .logo{
    width:56px;height:56px;margin:0 auto 12px;border-radius:16px;
    display:grid;place-items:center;font-size:26px;font-weight:800;color:#fff;
    background:linear-gradient(145deg,var(--accent-blue),var(--accent-purple));
    box-shadow:0 12px 30px rgba(59,136,255,.35);
  }
  h1{font-size:1.5rem;color:var(--accent-blue);letter-spacing:1px;margin-bottom:4px;}
  .subtitle{color:var(--text-gray);font-size:.9rem;}

  .panel{
    background:var(--bg-panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:18px;
    margin-bottom:14px;
    box-shadow:0 18px 40px rgba(0,0,0,.35);
  }
  .panel-title{
    text-align:center;font-size:1.02rem;font-weight:700;color:var(--accent-blue);
    margin-bottom:14px;
  }
  .form-input{
    width:100%;
    background:var(--input-bg);
    border:1px solid var(--border);
    color:var(--text-main);
    padding:12px 14px;
    border-radius:8px;
    outline:none;
    font-size:1rem;
    letter-spacing:1.4px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    text-transform:uppercase;
    transition:.2s;
  }
  .form-input::placeholder{color:#6b6c8f;letter-spacing:1px;font-family:inherit;}
  .form-input:focus{border-color:var(--accent-blue);box-shadow:0 0 0 3px rgba(59,136,255,.16);}

  .btn{
    display:flex;align-items:center;justify-content:center;gap:6px;
    width:100%;padding:12px 16px;margin-top:12px;
    border:none;border-radius:8px;cursor:pointer;
    font-size:1rem;font-weight:700;color:#fff;
    background:linear-gradient(135deg,var(--accent-blue),var(--accent-purple));
    transition:filter .18s,opacity .18s,transform .1s;
  }
  .btn:active{transform:scale(.99);}
  .btn:hover{filter:brightness(1.08);}
  .btn:disabled{opacity:.55;cursor:default;filter:grayscale(.2);}

  .msg{
    display:none;margin-top:12px;padding:10px 12px;border-radius:8px;
    font-size:.88rem;line-height:1.6;
  }
  .msg.show{display:block;}
  .msg.err{color:#ffb3bc;background:rgba(255,71,87,.12);border:1px solid rgba(255,71,87,.4);}
  .msg.ok{color:#b8ffcf;background:rgba(46,213,115,.12);border:1px solid rgba(46,213,115,.38);}

  .banner{
    display:none;margin-bottom:14px;padding:11px 13px;border-radius:8px;
    font-size:.85rem;color:#ffe9a3;
    background:rgba(255,211,42,.1);border:1px dashed rgba(255,211,42,.45);
  }
  .banner.show{display:block;}

  .tip{font-size:.78rem;color:var(--text-gray);margin-top:12px;line-height:1.7;}
  .hidden{display:none !important;}

  .foot{
    text-align:center;font-size:.78rem;color:#6b6c8f;line-height:1.9;margin-top:16px;
  }
  .foot a{color:#7ea6e0;text-decoration:none;}
  .foot a:hover{color:var(--accent-blue);}
  .enter-tip{display:none;text-align:center;margin-top:12px;font-size:.86rem;}
  .enter-tip.show{display:block;}
  .enter-tip a{color:var(--accent-blue);text-decoration:none;font-weight:600;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">QT</div>
    <h1 id="brandTitle">闲鱼秋天游戏</h1>
    <div class="subtitle">秋天 控制台 v1.0 Pro</div>
  </header>

  <div class="panel">
    <div class="banner" id="publicBanner">站点现在是公益状态，直接进入即可 —— 点下面的按钮进去。</div>

    <div class="panel-title" id="cardTitle">🔒 安全访问验证</div>

    <form id="form" autocomplete="off">
      <div id="codeField">
        <input id="code" class="form-input" type="text" inputmode="text" spellcheck="false"
               placeholder="输入卡密" maxlength="48" />
      </div>
      <button id="submit" class="btn" type="submit">验证卡密</button>
    </form>

    <div class="msg" id="msg"></div>
    <div class="enter-tip" id="enterTip"><a href="/">进入工具页 →</a></div>

    <div class="tip" id="cardSub">卡密由管理员发放，次数卡按功能单独计次；输入后自动记录到这台设备。</div>
  </div>

  <div class="foot">
    有问题找发卡的人 · <a href="/admin">管理入口</a>
  </div>
</div>

<script>
(function () {
  var form = document.getElementById('form');
  var input = document.getElementById('code');
  var btn = document.getElementById('submit');
  var msg = document.getElementById('msg');
  var codeField = document.getElementById('codeField');
  var cardTitle = document.getElementById('cardTitle');
  var cardSub = document.getElementById('cardSub');
  var banner = document.getElementById('publicBanner');
  var enterTip = document.getElementById('enterTip');
  var publicMode = false;

  function show(text, kind) {
    if (!text) { msg.className = 'msg'; msg.textContent = ''; return; }
    msg.textContent = text;
    msg.className = 'msg show ' + (kind || 'err');
  }

  fetch('/api/gate/status', { credentials: 'same-origin' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d && d.title) document.getElementById('brandTitle').textContent = d.title;
      publicMode = !!(d && d.publicMode);
      if (d && d.authorized) { location.replace('/'); return; }
      if (publicMode) {
        banner.classList.add('show');
        cardTitle.textContent = '公益开放中';
        cardSub.textContent = '现在不需要卡密，点下面的按钮直接进入。';
        codeField.classList.add('hidden');
        btn.textContent = '直接进入';
      }
    })
    .catch(function () {});

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (publicMode) { location.replace('/'); return; }

    var code = (input.value || '').trim();
    if (!code) { show('先填卡密'); input.focus(); return; }

    btn.disabled = true;
    var old = btn.textContent;
    btn.textContent = '验证中…';
    show('');

    fetch('/api/gate/verify', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: code }),
    })
      .then(function (r) { return r.json().then(function (d) { return { s: r.status, d: d }; }); })
      .then(function (x) {
        if (x.d && x.d.ok) {
          show('验证通过，正在进入…', 'ok');
          setTimeout(function () { location.replace('/'); }, 320);
          return;
        }
        show((x.d && x.d.message) || '验证失败，检查一下卡密');
        btn.disabled = false;
        btn.textContent = old;
      })
      .catch(function () {
        show('网络连不上，稍后再试');
        btn.disabled = false;
        btn.textContent = old;
      });
  });

  input.addEventListener('input', function () {
    var v = input.value.toUpperCase().replace(/[^A-Z0-9-]/g, '');
    if (v !== input.value) input.value = v;
  });
})();
</script>
</body>
</html>
